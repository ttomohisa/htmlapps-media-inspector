name: Validate standalone HTML

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "app.config.json"
      - "dependencies.json"
      - "build-standalone.ps1"
      - "build-standalone.bat"
      - ".github/scripts/release.cjs"
      - ".github/workflows/build-standalone.yml"
  push:
    branches: [main]
    paths: ["app.config.json"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      checksums: ${{ steps.package.outputs.checksums }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine release version
        if: github.event_name != 'workflow_dispatch'
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/release.cjs

      - name: Build and verify standalone HTML
        shell: pwsh
        run: |
          $env:SOURCE_DATE_EPOCH = git show -s --format=%ct HEAD
          ./scripts/check-repository.ps1
          node --test tests/*.test.cjs tests/release.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Application or release regression failed" }

      - name: Upload standalone artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: standalone-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/index.html
            dist/index.self-extract.html
            dist/dependency-manifest.json
            dist/self-extract-manifest.json
            dist/.nojekyll
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          overwrite: true

      - name: Exercise both release files in Chromium
        if: steps.version.outputs.tag != ''
        shell: pwsh
        run: |
          $testTools = Join-Path $env:RUNNER_TEMP "release-tests"
          npm install --prefix $testTools --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.58.2
          if ($LASTEXITCODE -ne 0) { throw "Playwright installation failed" }
          $env:NODE_PATH = Join-Path $testTools "node_modules"
          & (Join-Path $testTools "node_modules/.bin/playwright.cmd") install chromium
          if ($LASTEXITCODE -ne 0) { throw "Chromium installation failed" }
          $env:PLAYWRIGHT_CHANNEL = "chromium"
          node scripts/test-inspection-workspace.cjs
          if ($LASTEXITCODE -ne 0) { throw "Inspection workspace regression failed" }
          node --test scripts/test-inspection-lifecycle.cjs
          if ($LASTEXITCODE -ne 0) { throw "Inspection lifecycle regression failed" }

      - name: Package release downloads
        id: package
        if: steps.version.outputs.tag != ''
        run: python scripts/package-release.py "$env:RUNNER_TEMP/release-downloads"

      - name: Save verified release downloads
        if: steps.version.outputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-downloads
          path: ${{ runner.temp }}/release-downloads/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: media-inspector-release-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-downloads
          path: release-downloads
      - name: Publish the verified commit and downloads
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          EXPECTED_CHECKSUMS: ${{ needs.build.outputs.checksums }}
        with:
          script: |
            const fs = require('node:fs');
            const { releaseNotes, publishRelease } = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/release.cjs');
            const tag = process.env.RELEASE_TAG;
            const notes = releaseNotes(fs.readFileSync('CHANGELOG.md', 'utf8'), tag);
            const stem = 'htmlapps-media-inspector-' + tag;
            const assets = [stem + '.html', stem + '.self-extract.html', stem + '.zip', 'SHA256SUMS.txt']
              .map(name => ({ name, data: fs.readFileSync('release-downloads/' + name) }));
            await publishRelease({ github, repo: context.repo, sha: context.sha, tag, notes, assets, checksums: process.env.EXPECTED_CHECKSUMS });
